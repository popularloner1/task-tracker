<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Task Tracker — Worksheet</title>

<!-- Browser Tab Favicons & iOS App Icons -->
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon.png?v=2">
<link rel="shortcut icon" href="/favicon.ico?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Task Tracker">
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    --bg: #f1f4fb;
    --bg-white: #ffffff;
    --bg-card: #ffffff;
    --bg-sidebar: #1b1838;
    --bg-input: #f5f7fc;
    --border: #e6e9f4;
    --border-focus: #6d4aff;
    --text: #1e2438;
    --text-secondary: #64708c;
    --text-dim: #94a0b8;

    --purple: #6d4aff;
    --purple-light: #efeaff;
    --blue: #3b82f6;
    --blue-light: #e0edff;
    --cyan: #06b6d4;
    --cyan-light: #d7f7fc;
    --orange: #f97316;
    --orange-light: #fff1e5;
    --pink: #ec4899;
    --pink-light: #fde8f3;
    --green: #16a34a;
    --green-light: #dcfce7;
    --red: #ef4444;
    --red-light: #fee2e2;
    --yellow: #ca8a04;
    --yellow-light: #fef3c7;
    --gray: #64748b;

    --grad-purple: linear-gradient(135deg, #6d4aff 0%, #9b7bff 100%);
    --grad-blue: linear-gradient(135deg, #3b82f6 0%, #38bdf8 100%);
    --grad-orange: linear-gradient(135deg, #f59e0b 0%, #fb923c 100%);
    --grad-pink: linear-gradient(135deg, #ec4899 0%, #f472b6 100%);
    --grad-green: linear-gradient(135deg, #10b981 0%, #34d399 100%);
    --grad-cyan: linear-gradient(135deg, #06b6d4 0%, #22d3ee 100%);
    --grad-red: linear-gradient(135deg, #ef4444 0%, #f87171 100%);

    --shadow-card: 0 4px 20px rgba(27, 24, 56, 0.05);
    --shadow-hover: 0 10px 28px rgba(109, 74, 255, 0.12);
    --shadow-lg: 0 18px 48px rgba(15, 17, 35, 0.16);
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    display: flex;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ═══════════════ Desktop Floating Rounded Glass Dock ═══════════════ */
  .sidebar {
    width: 68px;
    height: auto;
    background: rgba(27, 24, 56, 0.90);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 36px;
    box-shadow: 0 20px 48px rgba(15, 12, 40, 0.28), 0 0 0 1px rgba(255, 255, 255, 0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 0;
    gap: 12px;
    position: fixed;
    top: 50%;
    left: 20px;
    bottom: auto;
    transform: translateY(-50%);
    z-index: 200;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .sidebar-logo {
    width: 44px;
    height: 44px;
    background: var(--grad-purple);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    margin-bottom: 8px;
    box-shadow: 0 6px 18px rgba(109, 74, 255, 0.5);
  }
  .sidebar-btn {
    width: 46px;
    height: 46px;
    border: none;
    background: transparent;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: rgba(255, 255, 255, 0.55);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }
  .sidebar-btn svg { width: 21px; height: 21px; stroke-width: 2; }
  .sidebar-btn:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.12);
    transform: scale(1.08);
  }
  .sidebar-btn.active {
    color: #fff;
    background: var(--grad-purple);
    box-shadow: 0 6px 18px rgba(109, 74, 255, 0.6);
    transform: scale(1.06);
  }
  .sidebar-btn.active::before {
    display: none;
  }
  .sidebar-btn .tooltip {
    display: none;
    position: absolute;
    left: 62px;
    background: rgba(27, 24, 56, 0.95);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: #fff;
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    pointer-events: none;
    z-index: 300;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  }
  .sidebar-btn:hover .tooltip { display: block; animation: tooltipFade 0.15s ease; }
  @keyframes tooltipFade { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: translateX(0); } }

  /* ═══════════════ Main Area ═══════════════ */
  .main {
    flex: 1;
    margin-left: 98px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-width: 0;
  }

  /* ═══════════════ Top Header ═══════════════ */
  .top-header {
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 15px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .top-header-left { display: flex; align-items: center; gap: 14px; }
  .top-header h1 {
    font-size: 21px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.5px;
  }
  .top-header h1 span { color: var(--purple); }
  .sync-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: var(--green-light);
    color: var(--green);
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
  }
  .sync-dot {
    width: 7px; height: 7px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.85); }
  }

  .header-search {
    position: relative;
    width: 340px;
    max-width: 100%;
  }
  .header-search input {
    width: 100%;
    padding: 10px 16px 10px 38px;
    background: var(--bg-input);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 13.5px;
    color: var(--text);
    outline: none;
    transition: all 0.2s;
    font-family: inherit;
  }
  .header-search input:focus { border-color: var(--purple); background: #fff; box-shadow: 0 0 0 3px rgba(109,74,255,0.1); }
  .header-search input::placeholder { color: var(--text-dim); }
  .header-search .search-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    pointer-events: none;
    display: flex;
  }

  .top-header-right { display: flex; align-items: center; gap: 10px; }
  .btn {
    padding: 10px 18px;
    border: none;
    border-radius: 11px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: inherit;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--grad-purple);
    color: #fff;
    box-shadow: 0 4px 14px rgba(109, 74, 255, 0.32);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(109, 74, 255, 0.42); }
  .btn-ghost {
    background: var(--bg-white);
    color: var(--text-secondary);
    border: 1.5px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--purple); color: var(--purple); }
  .btn-sm { padding: 7px 14px; font-size: 12.5px; border-radius: 9px; }

  /* ═══════════════ Content ═══════════════ */
  .content { flex: 1; padding: 24px 32px; }
  .view { display: none; }
  .view.active { display: block; animation: fadeIn 0.18s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* ═══════════════ Dashboard View ═══════════════ */
  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 16px;
    margin-bottom: 22px;
  }
  .stat-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: var(--shadow-card);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
  .stat-icon {
    width: 46px;
    height: 46px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .stat-icon svg { width: 22px; height: 22px; }
  .stat-value {
    font-size: 26px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.8px;
  }
  .stat-label {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 600;
    margin-top: 3px;
  }

  .dashboard-row {
    display: grid;
    grid-template-columns: 330px 1fr;
    gap: 20px;
    margin-bottom: 22px;
  }
  .card-panel {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow-card);
    border: 1px solid var(--border);
  }
  .card-panel h3 {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 18px;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .donut-card { text-align: center; }
  .donut-wrap {
    position: relative;
    width: 176px;
    height: 176px;
    margin: 0 auto 16px;
  }
  .donut-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .donut-wrap .donut-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .donut-center .big { font-size: 34px; font-weight: 800; color: var(--text); letter-spacing: -1px; }
  .donut-center .sub { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
  .donut-legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px 14px;
    margin-top: 8px;
  }
  .donut-legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .donut-legend-dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }

  .recent-list { list-style: none; }
  .recent-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 10px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    border-radius: 10px;
    transition: background 0.15s;
  }
  .recent-item:last-child { border-bottom: none; }
  .recent-item:hover { background: var(--bg-input); }
  .recent-item .ri-color { width: 5px; height: 38px; border-radius: 4px; flex-shrink: 0; }
  .recent-item .ri-info { flex: 1; min-width: 0; }
  .recent-item .ri-title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent-item .ri-meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .recent-item .ri-badge { padding: 4px 10px; border-radius: 7px; font-size: 11px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }

  /* Project Gradient Strip (from reference UI bottom-left) */
  .projects-strip {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
    margin-bottom: 22px;
  }
  .proj-grad-card {
    border-radius: var(--radius);
    padding: 20px;
    color: #fff;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(15, 17, 35, 0.12);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .proj-grad-card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(15, 17, 35, 0.18); }
  .proj-grad-card::after {
    content: '';
    position: absolute;
    right: -20px;
    bottom: -24px;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: rgba(255,255,255,0.14);
  }
  .proj-grad-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .proj-pill {
    background: rgba(255,255,255,0.22);
    backdrop-filter: blur(4px);
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
  }
  .proj-grad-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj-grad-sub { font-size: 12px; opacity: 0.9; }

  .bar-chart { display: flex; flex-direction: column; gap: 11px; }
  .bar-row { display: flex; align-items: center; gap: 14px; }
  .bar-label { width: 80px; font-size: 13px; font-weight: 600; color: var(--text-secondary); text-align: right; flex-shrink: 0; }
  .bar-track { flex: 1; height: 24px; background: var(--bg-input); border-radius: 8px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 8px; transition: width 0.5s ease; }
  .bar-count { width: 28px; font-size: 13px; font-weight: 700; color: var(--text); flex-shrink: 0; }

  /* ═══════════════ Board View (Kanban) ═══════════════ */
  .board {
    display: flex;
    gap: 16px;
    overflow-x: auto;
    padding-bottom: 20px;
    min-height: calc(100vh - 170px);
  }
  .board-column {
    min-width: 268px;
    flex: 1;
    display: flex;
    flex-direction: column;
    background: rgba(255,255,255,0.55);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }
  .column-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding: 0 4px; }
  .column-header-left { display: flex; align-items: center; gap: 9px; }
  .column-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .column-title { font-size: 14px; font-weight: 700; color: var(--text); }
  .column-count {
    min-width: 24px; height: 24px; padding: 0 6px;
    border-radius: 7px; background: var(--bg-white); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--text-secondary);
  }
  .column-cards {
    flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 80px;
    border-radius: var(--radius-sm); transition: background 0.2s;
  }
  .column-cards.drag-over {
    background: rgba(109, 74, 255, 0.08);
    outline: 2px dashed var(--purple);
    outline-offset: -2px;
  }

  .task-card {
    background: var(--bg-card);
    border-radius: 12px;
    padding: 16px;
    box-shadow: var(--shadow-card);
    border: 1px solid var(--border);
    cursor: grab;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .task-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
  .task-card.dragging { opacity: 0.45; transform: rotate(1.5deg); }
  .task-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; }
  .task-card.priority-urgent::before { background: var(--grad-red); }
  .task-card.priority-high::before { background: var(--grad-orange); }
  .task-card.priority-medium::before { background: var(--grad-blue); }
  .task-card.priority-low::before { background: var(--grad-cyan); }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
  .card-title { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.35; }
  .card-id { font-size: 11px; font-weight: 700; color: var(--text-dim); background: var(--bg-input); padding: 2px 7px; border-radius: 5px; flex-shrink: 0; }
  .card-desc { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .card-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .card-tag { padding: 3px 8px; border-radius: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.2px; }
  .card-tag.client { background: var(--purple-light); color: var(--purple); }
  .card-tag.project { background: var(--blue-light); color: var(--blue); }
  .card-tag.category { background: var(--orange-light); color: var(--orange); }
  .card-date { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
  .card-date.overdue { color: var(--red); }
  .card-date.soon { color: var(--orange); }
  .card-date.ok { color: var(--green); }
  .card-bottom {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
  }
  .card-rev { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); cursor: pointer; font-weight: 500; }
  .card-rev:hover { color: var(--purple); }
  .card-rev .rev-count { background: var(--purple-light); color: var(--purple); padding: 1px 7px; border-radius: 5px; font-weight: 700; font-size: 11px; }
  .card-actions { display: flex; gap: 4px; }
  .card-action-btn {
    width: 28px; height: 28px; border: none; background: var(--bg-input); border-radius: 7px;
    cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary); transition: all 0.15s;
  }
  .card-action-btn:hover { background: var(--purple-light); color: var(--purple); }
  .card-action-btn.delete:hover { background: var(--red-light); color: var(--red); }

  /* ═══════════════ Table / Spreadsheet View ═══════════════ */
  .table-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .table-toolbar-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .table-toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-pill {
    padding: 7px 14px;
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    color: var(--text-secondary);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .filter-pill:hover { border-color: var(--purple); color: var(--purple); }
  .filter-pill.active { background: var(--purple); color: #fff; border-color: var(--purple); box-shadow: 0 3px 10px rgba(109,74,255,0.25); }
  .month-input {
    padding: 7px 14px;
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    color: var(--text);
    outline: none;
    font-family: inherit;
    cursor: pointer;
  }
  .month-input:focus { border-color: var(--purple); }

  .sheet-hint {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .table-scroll {
    overflow-x: auto;
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    border: 1px solid var(--border);
    background: var(--bg-card);
  }
  .data-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--bg-card);
  }
  .data-table thead { background: #f8f9fd; }
  .data-table th {
    padding: 13px 14px;
    text-align: left;
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
    border-bottom: 2px solid var(--border);
    border-right: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .data-table th:last-child { border-right: none; cursor: default; }
  .data-table th:hover:not(:last-child) { color: var(--purple); }
  .data-table td {
    padding: 8px 12px;
    font-size: 13.5px;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid #f0f2f8;
    vertical-align: middle;
  }
  .data-table td:last-child { border-right: none; }
  .data-table tbody tr:hover { background: rgba(109, 74, 255, 0.025); }
  .data-table tbody tr.row-quick-add { background: #fafbff; }

  /* Inline Excel-style cell editing */
  .cell-input {
    width: 100%;
    border: 1.5px solid transparent;
    background: transparent;
    padding: 6px 8px;
    border-radius: 7px;
    font-family: inherit;
    font-size: 13.5px;
    color: var(--text);
    outline: none;
    transition: all 0.15s;
  }
  .cell-input:hover { background: var(--bg-input); border-color: var(--border); }
  .cell-input:focus { background: #fff; border-color: var(--purple); box-shadow: 0 0 0 3px rgba(109,74,255,0.12); }
  .cell-input.title-col { font-weight: 600; min-width: 180px; }

  .cell-select {
    border: 1.5px solid transparent;
    border-radius: 8px;
    padding: 5px 10px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    outline: none;
    transition: all 0.15s;
  }
  .cell-select:focus { box-shadow: 0 0 0 3px rgba(109,74,255,0.15); }
  .sel-pending     { background: var(--yellow-light); color: #a16207; }
  .sel-in-progress { background: var(--blue-light); color: var(--blue); }
  .sel-in-revision { background: var(--purple-light); color: var(--purple); }
  .sel-on-hold     { background: #f1f5f9; color: var(--gray); }
  .sel-delivered   { background: var(--green-light); color: #15803d; }
  .sel-cancelled   { background: #f1f5f9; color: var(--gray); }

  .prio-urgent { background: var(--red-light); color: var(--red); }
  .prio-high   { background: var(--orange-light); color: var(--orange); }
  .prio-medium { background: var(--blue-light); color: var(--blue); }
  .prio-low    { background: var(--cyan-light); color: var(--cyan); }

  .t-id { font-weight: 700; color: var(--text-dim); font-family: 'SF Mono', monospace; font-size: 12.5px; text-align: center; }
  .date-overdue-input { color: var(--red); font-weight: 700; }
  .date-soon-input { color: var(--orange); font-weight: 700; }

  .rev-badge {
    width: 28px; height: 28px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; cursor: pointer; transition: transform 0.15s;
  }
  .rev-badge:hover { transform: scale(1.15); }
  .rev-has { background: var(--purple-light); color: var(--purple); }
  .rev-none { background: var(--bg-input); color: var(--text-dim); }

  .table-actions { display: flex; gap: 4px; }
  .tbl-action {
    width: 30px; height: 30px; border: 1px solid var(--border); border-radius: 8px;
    background: #fff; cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary); transition: all 0.15s;
  }
  .tbl-action:hover { border-color: var(--purple); color: var(--purple); }
  .tbl-action.del:hover { border-color: var(--red); color: var(--red); }

  /* ═══════════════ Calendar / Schedule View ═══════════════ */
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .cal-header h2 { font-size: 18px; font-weight: 800; }
  .cal-nav { display: flex; align-items: center; gap: 8px; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
  }
  .cal-dow {
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    padding: 8px 0;
  }
  .cal-day {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 13px;
    min-height: 118px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    box-shadow: var(--shadow-card);
  }
  .cal-day.other-month { opacity: 0.45; background: #f7f8fc; }
  .cal-day.is-today { border: 2px solid var(--purple); background: #faf8ff; }
  .cal-day-num {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-secondary);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cal-day.is-today .cal-day-num { color: var(--purple); }
  .cal-event {
    padding: 5px 8px;
    border-radius: 7px;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }

  .empty-state { text-align: center; padding: 70px 20px; }
  .empty-state .emoji { font-size: 50px; margin-bottom: 12px; }
  .empty-state h3 { font-size: 19px; font-weight: 700; margin-bottom: 6px; }
  .empty-state p { color: var(--text-secondary); font-size: 14px; }

  /* ═══════════════ Toast Notification ═══════════════ */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #1b1838;
    color: #fff;
    padding: 11px 18px;
    border-radius: 11px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 10px 28px rgba(0,0,0,0.22);
    z-index: 2000;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.25s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* ═══════════════ Modals ═══════════════ */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(15,17,35,0.48); backdrop-filter: blur(6px);
    z-index: 1000; justify-content: center; align-items: flex-start; padding-top: 56px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px;
    width: 92%; max-width: 580px; max-height: 85vh; overflow-y: auto;
    box-shadow: var(--shadow-lg); animation: modalIn 0.2s ease;
  }
  @keyframes modalIn { from { opacity:0; transform: translateY(-16px) scale(0.97); } to { opacity:1; transform: translateY(0) scale(1); } }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 26px; border-bottom: 1px solid var(--border); }
  .modal-header h2 { font-size: 17px; font-weight: 700; }
  .modal-close {
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    border: none; background: var(--bg-input); border-radius: 9px;
    color: var(--text-secondary); cursor: pointer; font-size: 15px;
  }
  .modal-close:hover { background: var(--red-light); color: var(--red); }
  .modal-body { padding: 22px 26px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 11.5px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 10px 14px; background: var(--bg-input); border: 1.5px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 13.5px; font-family: inherit; outline: none; transition: all 0.2s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--purple); background: #fff; box-shadow: 0 0 0 3px rgba(109,74,255,0.1); }
  .form-group textarea { resize: vertical; min-height: 76px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 26px; border-top: 1px solid var(--border); }

  .revision-list { list-style: none; }
  .revision-item {
    padding: 13px 15px; background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 10px; margin-bottom: 10px; border-left: 3.5px solid var(--purple);
  }
  .revision-item .rev-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }
  .revision-item .rev-num { font-weight:700; color:var(--purple); font-size:12.5px; }
  .revision-item .rev-date { font-size:11.5px; color:var(--text-dim); }
  .revision-item .rev-desc { font-size:13.5px; color:var(--text); }
  .revision-item .rev-by { font-size:12px; color:var(--text-secondary); margin-top:4px; }

  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 7px; font-size: 12px; font-weight: 700; }
  .chip-pending     { background: var(--yellow-light); color: #a16207; }
  .chip-in-progress { background: var(--blue-light); color: var(--blue); }
  .chip-in-revision { background: var(--purple-light); color: var(--purple); }
  .chip-on-hold     { background: #f1f5f9; color: var(--gray); }
  .chip-delivered   { background: var(--green-light); color: #15803d; }
  .chip-cancelled   { background: #f1f5f9; color: var(--gray); }
  .priority-badge { padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }

  @media (max-width: 1200px) { .dashboard-grid { grid-template-columns: repeat(3, 1fr); } }
  
  @media (max-width: 900px) {
    .sidebar {
      width: calc(100% - 36px);
      max-width: 380px;
      height: 64px;
      position: fixed;
      top: auto;
      bottom: 20px;
      left: 50%;
      right: auto;
      transform: translateX(-50%);
      flex-direction: row;
      justify-content: space-around;
      align-items: center;
      padding: 6px 12px;
      gap: 8px;
      background: rgba(27, 24, 56, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 36px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 16px 36px rgba(15, 12, 40, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.08);
      z-index: 300;
    }
    .sidebar-logo { display: none; }
    .sidebar-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      color: rgba(255, 255, 255, 0.6);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .sidebar-btn svg {
      width: 22px;
      height: 22px;
    }
    .sidebar-btn.active::before {
      display: none;
    }
    .sidebar-btn.active {
      color: #ffffff;
      background: var(--grad-purple);
      box-shadow: 0 4px 14px rgba(109, 74, 255, 0.55);
      border-bottom: none;
      transform: translateY(-2px);
    }
    .sidebar-btn .tooltip { display: none !important; }

    .main {
      margin-left: 0;
      padding-bottom: 100px;
    }
    .top-header {
      padding: 12px 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .top-header-left {
      width: 100%;
      justify-content: space-between;
    }
    .header-search {
      order: 3;
      width: 100%;
      max-width: 100%;
    }
    .top-header-right {
      order: 2;
      width: 100%;
      justify-content: space-between;
    }
    .top-header-right .btn {
      flex: 1;
      justify-content: center;
    }

    .content {
      padding: 16px 14px;
    }

    .dashboard-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-card {
      padding: 12px 14px;
      gap: 10px;
    }
    .stat-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
    }
    .stat-icon svg { width: 18px; height: 18px; }
    .stat-value { font-size: 20px; }
    .stat-label { font-size: 11px; }

    .dashboard-row {
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .projects-strip {
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .board {
      flex-direction: column;
      gap: 16px;
    }
    .board-column {
      min-width: 100%;
      max-width: 100%;
    }

    .table-toolbar {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }
    .table-toolbar-left, .table-toolbar-right {
      width: 100%;
      justify-content: space-between;
    }
    .table-toolbar-right .month-input {
      flex: 1;
    }
    .filter-pills {
      overflow-x: auto;
      padding-bottom: 4px;
      width: 100%;
      flex-wrap: nowrap;
      -webkit-overflow-scrolling: touch;
    }
    .filter-pill {
      white-space: nowrap;
      flex-shrink: 0;
    }

    .cal-grid {
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .cal-day {
      min-height: 72px;
      padding: 4px;
      border-radius: 8px;
    }
    .cal-day-num { font-size: 10px; }
    .cal-event {
      font-size: 9px;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .cal-dow { font-size: 10px; padding: 4px 0; }

    .modal {
      width: 96%;
      max-height: 90vh;
      border-radius: 14px;
    }
    .modal-header { padding: 14px 18px; }
    .modal-body { padding: 16px 18px; }
    .form-row { grid-template-columns: 1fr; gap: 10px; }
    .modal-footer { padding: 12px 18px; }
  }
</style>
</head>
<body>

<!-- ═══ Sidebar ═══ -->
<nav class="sidebar">
  <div class="sidebar-logo" title="Task Tracker">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
      <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
      <path d="m9 14 2 2 4-4"></path>
    </svg>
  </div>
  <button class="sidebar-btn active" onclick="showView('dashboard', this)" aria-label="Dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>
    <span class="tooltip">Dashboard</span>
  </button>
  <button class="sidebar-btn" onclick="showView('board', this)" aria-label="Board">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>
    <span class="tooltip">Kanban Board</span>
  </button>
  <button class="sidebar-btn" onclick="showView('table', this)" aria-label="Worksheet">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 3h18v18H3z"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/></svg>
    <span class="tooltip">Excel Worksheet</span>
  </button>
  <button class="sidebar-btn" onclick="showView('calendar', this)" aria-label="Calendar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span class="tooltip">Delivery Schedule</span>
  </button>
</nav>

<!-- ═══ Main ═══ -->
<div class="main">
  <div class="top-header">
    <div class="top-header-left">
      <h1>Task <span>Tracker</span></h1>
      <div class="sync-pill" title="Synced with Antigravity Agent database"><span class="sync-dot"></span> Live Synced</div>
    </div>
    <div class="header-search">
      <span class="search-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </span>
      <input type="text" id="globalSearch" placeholder="Search tasks, clients, projects..." oninput="applyFilters()">
    </div>
    <div class="top-header-right">
      <button class="btn btn-ghost btn-sm" onclick="exportExcel()" title="Download Excel (.xls) spreadsheet for offline sharing">📊 Export Excel</button>
      <button class="btn btn-primary" onclick="openAddModal()">＋ Add Task</button>
    </div>
  </div>

  <div class="content">

    <!-- ═══ DASHBOARD VIEW ═══ -->
    <div class="view active" id="view-dashboard">
      <div class="dashboard-grid" id="dashStats"></div>
      <div class="dashboard-row">
        <div class="card-panel donut-card" id="donutCard"></div>
        <div class="card-panel">
          <h3><span>Recent &amp; Follow-Up Queue</span><button class="btn btn-ghost btn-sm" onclick="showView('table', document.querySelectorAll('.sidebar-btn')[2])">Open Worksheet →</button></h3>
          <ul class="recent-list" id="recentList"></ul>
        </div>
      </div>
      <div class="projects-strip" id="projectsStrip"></div>
      <div class="card-panel">
        <h3>Tasks by Priority</h3>
        <div class="bar-chart" id="priorityChart"></div>
      </div>
    </div>

    <!-- ═══ BOARD VIEW ═══ -->
    <div class="view" id="view-board">
      <div class="board" id="boardContainer"></div>
    </div>

    <!-- ═══ WORKSHEET / TABLE VIEW ═══ -->
    <div class="view" id="view-table">
      <div class="table-toolbar">
        <div class="table-toolbar-left">
          <div class="filter-pills" id="tablePills">
            <button class="filter-pill active" data-f="all" onclick="setTableFilter('all',this)">All</button>
            <button class="filter-pill" data-f="pending" onclick="setTableFilter('pending',this)">Pending</button>
            <button class="filter-pill" data-f="in-progress" onclick="setTableFilter('in-progress',this)">In Progress</button>
            <button class="filter-pill" data-f="in-revision" onclick="setTableFilter('in-revision',this)">In Revision</button>
            <button class="filter-pill" data-f="on-hold" onclick="setTableFilter('on-hold',this)">On Hold</button>
            <button class="filter-pill" data-f="delivered" onclick="setTableFilter('delivered',this)">Delivered</button>
          </div>
        </div>
        <div class="table-toolbar-right">
          <input type="month" class="month-input" id="tableMonth" onchange="applyFilters()" title="Filter by month for end-of-month review">
          <button class="btn btn-ghost btn-sm" onclick="clearTableFilters()">Clear</button>
          <button class="btn btn-ghost btn-sm" onclick="exportExcel()">📊 Export Excel</button>
        </div>
      </div>
      <div class="sheet-hint">💡 <strong>Spreadsheet Mode:</strong> Click any cell to edit inline (auto-saves immediately), or use the quick-add row at the bottom.</div>
      <div id="tableContainer"></div>
    </div>

    <!-- ═══ CALENDAR / SCHEDULE VIEW ═══ -->
    <div class="view" id="view-calendar">
      <div class="cal-header">
        <h2 id="calMonthTitle">Schedule</h2>
        <div class="cal-nav">
          <button class="btn btn-ghost btn-sm" onclick="shiftCalMonth(-1)">← Prev</button>
          <button class="btn btn-ghost btn-sm" onclick="resetCalMonth()">Today</button>
          <button class="btn btn-ghost btn-sm" onclick="shiftCalMonth(1)">Next →</button>
        </div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

  </div>
</div>

<!-- ═══ Add/Edit Modal ═══ -->
<div class="modal-overlay" id="taskModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Add New Task</h2>
      <button class="modal-close" onclick="closeModal('taskModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editTaskId">
      <div class="form-group">
        <label>Title *</label>
        <input type="text" id="fTitle" placeholder="What's the task?">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="fDesc" placeholder="Full details, deliverables, requirements..."></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Client</label>
          <input type="text" id="fClient" placeholder="Client name">
        </div>
        <div class="form-group">
          <label>Project</label>
          <input type="text" id="fProject" placeholder="Project name">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Category</label>
          <input type="text" id="fCategory" placeholder="e.g. video, design, dev">
        </div>
        <div class="form-group">
          <label>Priority</label>
          <select id="fPriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Received Date</label>
          <input type="date" id="fReceivedDate">
        </div>
        <div class="form-group">
          <label>Delivery Date *</label>
          <input type="date" id="fDate">
        </div>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="fStatus">
          <option value="pending">Pending</option>
          <option value="in-progress">In Progress</option>
          <option value="in-revision">In Revision</option>
          <option value="on-hold">On Hold</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('taskModal')">Cancel</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveTask()">Add Task</button>
    </div>
  </div>
</div>

<!-- ═══ Revision Modal ═══ -->
<div class="modal-overlay" id="revisionModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="revModalTitle">Revisions</h2>
      <button class="modal-close" onclick="closeModal('revisionModal')">✕</button>
    </div>
    <div class="modal-body">
      <div id="revList"></div>
      <div style="margin-top:20px; padding-top:18px; border-top:1px solid var(--border);">
        <h3 style="font-size:14px; font-weight:700; color:var(--purple); margin-bottom:12px;">＋ Log New Revision</h3>
        <input type="hidden" id="revTaskId">
        <div class="form-group">
          <label>What changed?</label>

<script>
// Firebase Cloud Configuration
const firebaseConfig = {

const API = '';

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── Dual-Mode Cloud & Local API ──
async function fetchTasks() {
  if (useCloud && db) {
    try {
      const snap = await db.collection("tasks").orderBy("id", "asc").get();
      if (!snap.empty) {
        allTasks = snap.docs.map(doc => ({ ...doc.data(), docId: doc.id })).filter(t => t.status !== 'deleted');
        renderAll();
        return;
      }
      // If Firestore collection is empty, migrate current local tasks up to Cloud
      try {
        const localRes = await fetch(`${API}/api/tasks`);
        const localTasks = await localRes.json();
        if (localTasks && localTasks.length > 0) {
          const batch = db.batch();
          for (const t of localTasks) {
            const ref = db.collection("tasks").doc(String(t.id));
            batch.set(ref, t);
          }
          await batch.commit();
          allTasks = localTasks.filter(t => t.status !== 'deleted');
          renderAll();
          showToast("Migrated tasks to 24/7 Cloud Database!");
          return;
        }
      } catch (err) {
        console.log("No local tasks to migrate:", err);
      }
      allTasks = [];
      renderAll();
      return;
    } catch (err) {
      console.warn("Firestore fetch error, falling back to local API:", err);
    }
  }

  // Fallback to local server API
  try {
    const r = await fetch(`${API}/api/tasks`);
    allTasks = await r.json();
    renderAll();
  } catch (err) {
    console.error("Fetch tasks failed:", err);
  }
}

async function createTask(d) {
  if (useCloud && db) {
    try {
      // Find max ID
      const maxId = allTasks.reduce((max, t) => Math.max(max, Number(t.id) || 0), 0) + 1;
      const now = new Date().toISOString();
      const newTask = {
        ...d,
        id: maxId,
        status: d.status || 'pending',
        received_date: d.received_date || today(),
        created_at: now,
        updated_at: now,
        revisions: [],
        follow_ups: [],
        notes: []
      };
      await db.collection("tasks").doc(String(maxId)).set(newTask);
      showToast(`Task #${maxId} saved to Cloud`);
      // Also sync to local backend if running
      fetch(`${API}/api/tasks`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newTask) }).catch(() => {});
      return newTask;
    } catch (err) {
      console.warn("Firestore create failed, falling back to local:", err);
    }
  }

  const res = await (await fetch(`${API}/api/tasks`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(d) })).json();
  showToast(`Task #${res.id} added`);
  return res;
}

async function updateTask(id, d, silent = false) {
  if (useCloud && db) {
    try {
      const now = new Date().toISOString();
      await db.collection("tasks").doc(String(id)).set({ ...d, updated_at: now }, { merge: true });
      if (!silent) showToast(`Saved task #${id} (Cloud)`);
      // Also update local backend if running
      fetch(`${API}/api/tasks/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d) }).catch(() => {});
      return { id, ...d };
    } catch (err) {
      console.warn("Firestore update failed, falling back to local:", err);
    }
  }

  const res = await (await fetch(`${API}/api/tasks/${id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(d) })).json();
  if (!silent) showToast(`Saved task #${id}`);
  return res;
}

async function deleteTask(id) {
  if (useCloud && db) {
    try {
      await db.collection("tasks").doc(String(id)).set({ status: 'deleted', updated_at: new Date().toISOString() }, { merge: true });
      showToast(`Deleted task #${id} (Cloud)`);
      fetch(`${API}/api/tasks/${id}`, { method: 'DELETE' }).catch(() => {});
      return;
    } catch (err) {
      console.warn("Firestore delete failed, falling back to local:", err);
    }
  }

  await fetch(`${API}/api/tasks/${id}`, { method:'DELETE' });
  showToast(`Deleted task #${id}`);
}

async function createRevision(id, d) {
  if (useCloud && db) {
    try {
      const t = allTasks.find(x => x.id === id);
      const revs = t?.revisions ? [...t.revisions] : [];
      const revNum = revs.length + 1;
      const newRev = {
        ...d,
        revision_number: revNum,
        timestamp: new Date().toISOString()
      };
      revs.push(newRev);
      await db.collection("tasks").doc(String(id)).set({
        revisions: revs,
        status: 'in-revision',
        updated_at: new Date().toISOString()
      }, { merge: true });
      showToast(`Logged Revision #${revNum} (Cloud)`);
      fetch(`${API}/api/tasks/${id}/revisions`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d) }).catch(() => {});
      return newRev;
    } catch (err) {
      console.warn("Firestore revision failed, falling back to local:", err);
    }
  }

  const res = await (await fetch(`${API}/api/tasks/${id}/revisions`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(d) })).json();
  showToast(`Logged Revision #${res.revision_number}`);
  return res;
}

// ── Views ──
function showView(v, btn) {

// ── Helpers ──
const fmtLocalDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => fmtLocalDate(new Date());
const in3days = () => fmtLocalDate(new Date(Date.now()+3*864e5));
const getReceivedDate = tk => tk.received_date || (tk.created_at ? fmtLocalDate(new Date(tk.created_at)) : '');
const esc = s => { const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; };
const statusLabel = s => s.split('-').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');

function getFiltered() {
  const search = (document.getElementById('globalSearch').value || '').toLowerCase();
  const month = document.getElementById('tableMonth')?.value || '';
  let tasks = [...allTasks];
  if (search) tasks = tasks.filter(t =>
    [t.title,t.description,t.client,t.project,t.category].some(f => (f||'').toLowerCase().includes(search))
  );
  if (month) tasks = tasks.filter(t =>
    getReceivedDate(t).slice(0,7)===month || (t.delivery_date||'').slice(0,7)===month || (t.created_at||'').slice(0,7)===month
  );
  return tasks;
}

// ═══════════ DASHBOARD ═══════════
function renderDashboard() {
  const tasks = getFiltered();
  const t = today();
  const total = tasks.length;
  const pending = tasks.filter(x=>x.status==='pending').length;
  const inProg = tasks.filter(x=>x.status==='in-progress').length;
  const inRev = tasks.filter(x=>x.status==='in-revision').length;
  const delivered = tasks.filter(x=>x.status==='delivered').length;
  const overdue = tasks.filter(x=>!['delivered','cancelled'].includes(x.status) && x.delivery_date && x.delivery_date<t).length;

  document.getElementById('dashStats').innerHTML = `
    <div class="stat-card"><div class="stat-icon" style="background:var(--purple-light);color:var(--purple)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></div><div><div class="stat-value">${total}</div><div class="stat-label">Total Tasks</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:var(--red-light);color:var(--red)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div><div><div class="stat-value" style="color:var(--red)">${overdue}</div><div class="stat-label">Overdue</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:var(--yellow-light);color:var(--yellow)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div><div class="stat-value">${pending}</div><div class="stat-label">Pending</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:var(--blue-light);color:var(--blue)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></div><div><div class="stat-value" style="color:var(--blue)">${inProg}</div><div class="stat-label">In Progress</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:var(--purple-light);color:var(--purple)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div><div><div class="stat-value" style="color:var(--purple)">${inRev}</div><div class="stat-label">In Revision</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:var(--green-light);color:var(--green)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></div><div><div class="stat-value" style="color:var(--green)">${delivered}</div><div class="stat-label">Delivered</div></div></div>
  `;

  const pct = total ? Math.round(delivered / total * 100) : 0;
  const r = 70, c = 2 * Math.PI * r;
  const parts = [
    { count: pending, color: '#eab308', label: 'Pending' },
    { count: inProg, color: '#3b82f6', label: 'In Progress' },
    { count: inRev, color: '#6d4aff', label: 'In Revision' },
    { count: tasks.filter(x=>x.status==='on-hold').length, color: '#94a3b8', label: 'On Hold' },
    { count: delivered, color: '#16a34a', label: 'Delivered' },
  ].filter(p=>p.count>0);
  let arcs = '', offset = 0;
  parts.forEach(p => {
    const len = total ? (p.count / total) * c : 0;
    arcs += `<circle cx="90" cy="90" r="${r}" fill="none" stroke="${p.color}" stroke-width="15" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="-${offset}" stroke-linecap="round"/>`;
    offset += len;
  });
  document.getElementById('donutCard').innerHTML = `
    <h3 style="justify-content:center;">Completion</h3>
    <div class="donut-wrap">
      <svg viewBox="0 0 180 180">${total?arcs:`<circle cx="90" cy="90" r="${r}" fill="none" stroke="#e6e9f4" stroke-width="15"/>`}</svg>
      <div class="donut-center"><div class="big">${pct}%</div><div class="sub">Delivered</div></div>
    </div>
    <div class="donut-legend">${parts.map(p=>`<div class="donut-legend-item"><div class="donut-legend-dot" style="background:${p.color}"></div>${p.label} (${p.count})</div>`).join('')}</div>
  `;

  const overdueList = tasks.filter(x=>!['delivered','cancelled'].includes(x.status) && x.delivery_date && x.delivery_date<t);
  const recent = [...tasks].sort((a,b)=>b.id-a.id).slice(0,6);
  const display = [...overdueList, ...recent.filter(r=>!overdueList.find(o=>o.id===r.id))].slice(0,6);
  document.getElementById('recentList').innerHTML = display.length ? display.map(tk => {
    const isOD = overdueList.includes(tk);
    const sc = statusColors[tk.status] || statusColors.pending;
    return `<li class="recent-item" onclick="openDetail(${tk.id})">
      <div class="ri-color" style="background:${isOD?'var(--red)':sc.dot}"></div>
      <div class="ri-info">
        <div class="ri-title">${esc(tk.title)}</div>
        <div class="ri-meta">${esc(tk.client||'')}${tk.client&&tk.project?' · ':''}${esc(tk.project||'')}${getReceivedDate(tk)?' · Received: '+getReceivedDate(tk):''}${tk.delivery_date?' · Due: '+tk.delivery_date:''}</div>
      </div>
      <span class="ri-badge" style="background:${isOD?'var(--red-light)':sc.bg};color:${isOD?'var(--red)':sc.text}">${isOD?'OVERDUE':statusLabel(tk.status)}</span>
    </li>`;
  }).join('') : '<li style="text-align:center;padding:36px;color:var(--text-dim);">No tasks yet — click "+ Add Task" or tell Antigravity!</li>';

  // Project/Client gradient cards (matching reference UI)
  const groups = {};
  tasks.forEach(tk => {
    const key = tk.project || tk.client || 'General';
    if (!groups[key]) groups[key] = { name: key, total: 0, active: 0, done: 0 };
    groups[key].total++;
    if (tk.status === 'delivered') groups[key].done++; else groups[key].active++;
  });
  const groupList = Object.values(groups).slice(0, 4);
  document.getElementById('projectsStrip').innerHTML = groupList.map((g, i) => `
    <div class="proj-grad-card" style="background:${cardGrads[i % cardGrads.length]}" data-project="${esc(g.name)}" onclick="filterByProject(this.dataset.project)">
      <div class="proj-grad-top">
        <span class="proj-pill">${g.total} task${g.total!==1?'s':''}</span>
        <span class="proj-pill">${g.done}/${g.total} done</span>
      </div>
      <div class="proj-grad-name">${esc(g.name)}</div>
      <div class="proj-grad-sub">${g.active} active deliverable${g.active!==1?'s':''}</div>
    </div>
  `).join('');

  const priorities = ['urgent','high','medium','low'];
  const maxP = Math.max(1, ...priorities.map(p=>tasks.filter(x=>(x.priority||'medium')===p).length));
  document.getElementById('priorityChart').innerHTML = priorities.map(p => {
    const count = tasks.filter(x=>(x.priority||'medium')===p).length;
    return `<div class="bar-row">
      <div class="bar-label">${p[0].toUpperCase()+p.slice(1)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(count/maxP*100)}%;background:${priorityGrads[p]}"></div></div>
      <div class="bar-count">${count}</div>
    </div>`;
  }).join('');
}

function filterByProject(name) {
  document.getElementById('globalSearch').value = name === 'General' ? '' : name;
  showView('table', document.querySelectorAll('.sidebar-btn')[2]);
}

// ═══════════ BOARD ═══════════
function renderBoard() {
  const tasks = getFiltered();
  const columns = [
    { key:'pending', label:'Pending', dot:'#eab308' },
    { key:'in-progress', label:'In Progress', dot:'#3b82f6' },
    { key:'in-revision', label:'In Revision', dot:'#6d4aff' },
    { key:'on-hold', label:'On Hold', dot:'#94a3b8' },
    { key:'delivered', label:'Delivered', dot:'#16a34a' },
  ];
  const t = today(), t3 = in3days();
  document.getElementById('boardContainer').innerHTML = columns.map(col => {
    const colTasks = tasks.filter(x=>x.status===col.key);
    return `<div class="board-column">
      <div class="column-header">
        <div class="column-header-left">
          <div class="column-dot" style="background:${col.dot}"></div>
          <div class="column-title">${col.label}</div>
        </div>
        <div class="column-count">${colTasks.length}</div>
      </div>
      <div class="column-cards" data-status="${col.key}"
           ondragover="event.preventDefault();this.classList.add('drag-over')"
           ondragleave="this.classList.remove('drag-over')"
           ondrop="dropCard(event,this)">
        ${colTasks.map(tk => {
          const dc = (!tk.delivery_date||['delivered','cancelled'].includes(tk.status)) ? 'ok' :
            tk.delivery_date<t ? 'overdue' : tk.delivery_date<=t3 ? 'soon' : 'ok';
          const revs = (tk.revisions||[]).length;
          return `<div class="task-card priority-${tk.priority||'medium'}" draggable="true"
                       data-id="${tk.id}"
                       ondragstart="dragCard(event, ${tk.id})"
                       ondragend="event.target.classList.remove('dragging')">
            <div class="card-top">
              <div class="card-title">${esc(tk.title)}</div>
              <div class="card-id">#${tk.id}</div>
            </div>
            ${tk.description ? `<div class="card-desc">${esc(tk.description)}</div>` : ''}
            <div class="card-footer">
              <div class="card-tags">
                ${tk.client ? `<span class="card-tag client">${esc(tk.client)}</span>` : ''}
                ${tk.project ? `<span class="card-tag project">${esc(tk.project)}</span>` : ''}
                ${tk.category ? `<span class="card-tag category">${esc(tk.category)}</span>` : ''}
              </div>
              ${tk.delivery_date || getReceivedDate(tk) ? `<div class="card-date ${dc}">${getReceivedDate(tk)?`<span style="color:var(--text-dim);font-weight:500;">In ${getReceivedDate(tk)}</span> · `:''}${tk.delivery_date?`Due ${tk.delivery_date}`:''}</div>` : ''}
            </div>
            <div class="card-bottom">
              <div class="card-rev" onclick="event.stopPropagation();openRevisions(${tk.id})">
                Revisions: <span class="rev-count">${revs}</span>
              </div>
              <div class="card-actions">
                <button class="card-action-btn" onclick="event.stopPropagation();openDetail(${tk.id})" title="View">👁</button>
                <button class="card-action-btn" onclick="event.stopPropagation();openEditModal(${tk.id})" title="Edit">✏️</button>
                <button class="card-action-btn delete" onclick="event.stopPropagation();confirmDelete(${tk.id})" title="Delete">🗑</button>
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function dragCard(e, id) {
  e.dataTransfer.setData('text/plain', id);
  setTimeout(() => e.target.classList.add('dragging'), 0);
}
async function dropCard(e, col) {
  e.preventDefault();
  col.classList.remove('drag-over');
  const id = parseInt(e.dataTransfer.getData('text/plain'));
  await updateTask(id, { status: col.dataset.status });
  await fetchTasks();
}

// ═══════════ EXCEL-LIKE TABLE ═══════════
function setTableFilter(f, btn) {
  tableFilter = f;
  document.querySelectorAll('.filter-pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}
function clearTableFilters() {
  tableFilter = 'all';
  document.getElementById('globalSearch').value = '';
  document.getElementById('tableMonth').value = '';
  document.querySelectorAll('.filter-pill').forEach(b=>b.classList.remove('active'));
  document.querySelector('[data-f="all"]').classList.add('active');
  renderAll();
}

async function inlineUpdate(id, field, value) {
  const tk = allTasks.find(x => x.id === id);
  if (!tk || (tk[field] ?? '') === value) return;
  tk[field] = value;
  await updateTask(id, { [field]: value });
  renderDashboard();
  renderBoard();
  renderCalendar();
  if (field === 'status' || field === 'priority' || field === 'delivery_date') renderTable();
}

async function quickAddRow() {
  const title = document.getElementById('qaTitle').value.trim();
  const date = document.getElementById('qaDate').value;
  const receivedDate = document.getElementById('qaReceivedDate').value || today();
  if (!title) { alert('Enter a task title'); document.getElementById('qaTitle').focus(); return; }
  if (!date) { alert('Select a delivery date'); document.getElementById('qaDate').focus(); return; }
  await createTask({
    title,
    client: document.getElementById('qaClient').value.trim(),
    project: document.getElementById('qaProject').value.trim(),
    status: document.getElementById('qaStatus').value,
    priority: document.getElementById('qaPriority').value,
    received_date: receivedDate,
    delivery_date: date,
    description: ''
  });
  await fetchTasks();
}

function renderTable() {
  let tasks = getFiltered();
  if (tableFilter !== 'all') tasks = tasks.filter(t=>t.status===tableFilter);
  tasks.sort((a,b) => {
    const f = sortState.field;
    const av = f === 'received_date' ? getReceivedDate(a) : (a[f]||'');
    const bv = f === 'received_date' ? getReceivedDate(b) : (b[f]||'');
    const c = typeof av==='number'?av-bv:String(av).localeCompare(String(bv));
    return sortState.dir==='asc'?c:-c;
  });

  const t = today(), t3 = in3days();
  document.getElementById('tableContainer').innerHTML = `
    <div class="table-scroll">
    <table class="data-table">
      <thead><tr>
        <th onclick="tSort('id')" style="width:58px;text-align:center;">ID</th>
        <th onclick="tSort('title')">Title</th>
        <th onclick="tSort('client')">Client</th>
        <th onclick="tSort('project')">Project</th>
        <th onclick="tSort('status')">Status</th>
        <th onclick="tSort('priority')">Priority</th>
        <th onclick="tSort('received_date')">Received Date</th>
        <th onclick="tSort('delivery_date')">Delivery Date</th>
        <th style="width:60px;text-align:center;">Rev</th>
        <th style="width:110px;">Actions</th>
      </tr></thead>
      <tbody>
        ${tasks.map(tk => {
          const dc = (!tk.delivery_date||['delivered','cancelled'].includes(tk.status))?'':
            tk.delivery_date<t?'date-overdue-input':tk.delivery_date<=t3?'date-soon-input':'';
          const revs = (tk.revisions||[]).length;
          const recDate = getReceivedDate(tk);
          return `<tr>
            <td class="t-id">#${tk.id}</td>
            <td><input class="cell-input title-col" value="${esc(tk.title)}" onchange="inlineUpdate(${tk.id},'title',this.value)"></td>
            <td><input class="cell-input" value="${esc(tk.client||'')}" placeholder="—" onchange="inlineUpdate(${tk.id},'client',this.value)"></td>
            <td><input class="cell-input" value="${esc(tk.project||'')}" placeholder="—" onchange="inlineUpdate(${tk.id},'project',this.value)"></td>
            <td>
              <select class="cell-select sel-${tk.status}" onchange="inlineUpdate(${tk.id},'status',this.value)">
                ${['pending','in-progress','in-revision','on-hold','delivered','cancelled'].map(s =>
                  `<option value="${s}" ${tk.status===s?'selected':''}>${statusLabel(s)}</option>`
                ).join('')}
              </select>
            </td>
            <td>
              <select class="cell-select prio-${tk.priority||'medium'}" onchange="inlineUpdate(${tk.id},'priority',this.value)">
                ${['low','medium','high','urgent'].map(p =>
                  `<option value="${p}" ${(tk.priority||'medium')===p?'selected':''}>${p.toUpperCase()}</option>`
                ).join('')}
              </select>
            </td>
            <td><input type="date" class="cell-input" value="${recDate}" onchange="inlineUpdate(${tk.id},'received_date',this.value)"></td>
            <td><input type="date" class="cell-input ${dc}" value="${tk.delivery_date||''}" onchange="inlineUpdate(${tk.id},'delivery_date',this.value)"></td>
            <td style="text-align:center;"><span class="rev-badge ${revs?'rev-has':'rev-none'}" onclick="openRevisions(${tk.id})" title="Manage revisions">${revs}</span></td>
            <td><div class="table-actions">
              <button class="tbl-action" onclick="openDetail(${tk.id})" title="View Details">👁</button>
              <button class="tbl-action" onclick="openEditModal(${tk.id})" title="Edit Full">✏️</button>
              <button class="tbl-action del" onclick="confirmDelete(${tk.id})" title="Delete">🗑</button>
            </div></td>
          </tr>`;
        }).join('')}
        <tr class="row-quick-add">
          <td class="t-id">＋</td>
          <td><input class="cell-input title-col" id="qaTitle" placeholder="Quick add task title..." onkeydown="if(event.key==='Enter')quickAddRow()"></td>
          <td><input class="cell-input" id="qaClient" placeholder="Client" onkeydown="if(event.key==='Enter')quickAddRow()"></td>
          <td><input class="cell-input" id="qaProject" placeholder="Project" onkeydown="if(event.key==='Enter')quickAddRow()"></td>
          <td>
            <select class="cell-select sel-pending" id="qaStatus">
              <option value="pending">Pending</option>
              <option value="in-progress">In Progress</option>
            </select>
          </td>
          <td>
            <select class="cell-select prio-medium" id="qaPriority">
              <option value="low">LOW</option>
              <option value="medium" selected>MEDIUM</option>
              <option value="high">HIGH</option>
              <option value="urgent">URGENT</option>
            </select>
          </td>
          <td><input type="date" class="cell-input" id="qaReceivedDate" value="${t}" onkeydown="if(event.key==='Enter')quickAddRow()"></td>
          <td><input type="date" class="cell-input" id="qaDate" onkeydown="if(event.key==='Enter')quickAddRow()"></td>
          <td></td>
          <td><button class="btn btn-primary btn-sm" onclick="quickAddRow()">Add</button></td>
        </tr>
      </tbody>
    </table>
    </div>`;
}
function tSort(f) {
  sortState = sortState.field===f ? { field:f, dir:sortState.dir==='asc'?'desc':'asc' } : { field:f, dir:'asc' };
  renderTable();
}

// ═══════════ CALENDAR VIEW ═══════════
function shiftCalMonth(delta) { calDate = new Date(calDate.getFullYear(), calDate.getMonth() + delta, 1); renderCalendar(); }
function resetCalMonth() { calDate = new Date(); renderCalendar(); }

function renderCalendar() {
  const year = calDate.getFullYear(), month = calDate.getMonth();
  const monthName = calDate.toLocaleString('default', { month: 'long', year: 'numeric' });
  document.getElementById('calMonthTitle').textContent = `Delivery Schedule — ${monthName}`;

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const prevDays = new Date(year, month, 0).getDate();
  const todayStr = today();
  const tasks = getFiltered();

  const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let html = dows.map(d => `<div class="cal-dow">${d}</div>`).join('');

  for (let i = firstDay - 1; i >= 0; i--) {
    html += `<div class="cal-day other-month"><div class="cal-day-num">${prevDays - i}</div></div>`;
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayTasks = tasks.filter(x => x.delivery_date === iso);
    html += `<div class="cal-day ${iso === todayStr ? 'is-today' : ''}">
      <div class="cal-day-num"><span>${d}</span>${dayTasks.length?`<span style="font-size:10px;color:var(--purple);">${dayTasks.length} due</span>`:''}</div>
      ${dayTasks.map((tk, idx) => {
        const g = tk.status === 'delivered' ? 'var(--grad-green)' : cardGrads[tk.id % cardGrads.length];
        return `<div class="cal-event" style="background:${g}" onclick="openDetail(${tk.id})" title="${esc(tk.title)}">#${tk.id} ${esc(tk.title)}</div>`;
      }).join('')}
    </div>`;
  }
  const totalCells = firstDay + daysInMonth;
  const rem = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= rem; i++) {
    html += `<div class="cal-day other-month"><div class="cal-day-num">${i}</div></div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}

// ═══════════ MODALS ═══════════
function openAddModal() {
  document.getElementById('modalTitle').textContent = 'Add New Task';
  document.getElementById('saveBtn').textContent = 'Add Task';
  document.getElementById('editTaskId').value = '';
  ['fTitle','fDesc','fClient','fProject','fCategory'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fPriority').value = 'medium';
  document.getElementById('fReceivedDate').value = today();
  document.getElementById('fDate').value = '';
  document.getElementById('fStatus').value = 'pending';
  document.getElementById('taskModal').classList.add('show');
  document.getElementById('fTitle').focus();
}
function openEditModal(id) {
  const t = allTasks.find(x=>x.id===id);
  if (!t) return;
  document.getElementById('modalTitle').textContent = `Edit Task #${id}`;
  document.getElementById('saveBtn').textContent = 'Save Changes';
  document.getElementById('editTaskId').value = id;
  document.getElementById('fTitle').value = t.title||'';
  document.getElementById('fDesc').value = t.description||'';
  document.getElementById('fClient').value = t.client||'';
  document.getElementById('fProject').value = t.project||'';
  document.getElementById('fCategory').value = t.category||'';
  document.getElementById('fPriority').value = t.priority||'medium';
  document.getElementById('fReceivedDate').value = getReceivedDate(t);
  document.getElementById('fDate').value = t.delivery_date||'';
  document.getElementById('fStatus').value = t.status||'pending';
  document.getElementById('taskModal').classList.add('show');
}
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

async function saveTask() {
  const d = {
    title: document.getElementById('fTitle').value.trim(),
    description: document.getElementById('fDesc').value.trim(),
    client: document.getElementById('fClient').value.trim(),
    project: document.getElementById('fProject').value.trim(),
    category: document.getElementById('fCategory').value.trim(),
    priority: document.getElementById('fPriority').value,
    received_date: document.getElementById('fReceivedDate').value || today(),
    delivery_date: document.getElementById('fDate').value,
    status: document.getElementById('fStatus').value,
  };
  if (!d.title) { alert('Title is required'); return; }
  if (!d.delivery_date) { alert('Delivery date is required'); return; }
  const eid = document.getElementById('editTaskId').value;
  if (eid) await updateTask(parseInt(eid), d);
  else await createTask(d);
  closeModal('taskModal');
  await fetchTasks();
}
async function confirmDelete(id) {
  const t = allTasks.find(x=>x.id===id);
  if (confirm(`Delete task #${id}: "${t?.title}"?`)) { await deleteTask(id); await fetchTasks(); }
}

function openRevisions(id) {
  const t = allTasks.find(x=>x.id===id);
  if (!t) return;
  document.getElementById('revModalTitle').textContent = `Revisions — #${id} ${t.title}`;
  document.getElementById('revTaskId').value = id;
  document.getElementById('revDesc').value = '';
  document.getElementById('revBy').value = '';
  const revs = t.revisions||[];
  document.getElementById('revList').innerHTML = revs.length
    ? '<ul class="revision-list">' + revs.map(r => `<li class="revision-item">
        <div class="rev-header"><span class="rev-num">Revision #${r.revision_number}</span><span class="rev-date">${new Date(r.timestamp).toLocaleString()}</span></div>
        <div class="rev-desc">${esc(r.description||'')}</div>
        ${r.requested_by?`<div class="rev-by">Requested by: ${esc(r.requested_by)}</div>`:''}</li>`).join('')+'</ul>'
    : '<p style="text-align:center;padding:24px;color:var(--text-dim);">No revisions logged yet</p>';
  document.getElementById('revisionModal').classList.add('show');
}
async function addRevision() {
  const id = parseInt(document.getElementById('revTaskId').value);
  const desc = document.getElementById('revDesc').value.trim();
  if (!desc) { alert('Describe the revision'); return; }
  await createRevision(id, { description: desc, requested_by: document.getElementById('revBy').value.trim() });
  closeModal('revisionModal');
  await fetchTasks();
}

      <button class="btn btn-primary btn-sm" onclick="closeModal('detailModal');openEditModal(${t.id})">Edit Task</button>
    </div>`;
  document.getElementById('detailModal').classList.add('show');
}

document.addEventListener('keydown', e => {
  if (e.key==='Escape') document.querySelectorAll('.modal-overlay.show').forEach(m=>m.classList.remove('show'));
  if (e.key==='n' && !e.ctrlKey && !e.metaKey && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) { e.preventDefault(); openAddModal(); }
});
document.querySelectorAll('.modal-overlay').forEach(o => o.addEventListener('click', e => { if(e.target===o) o.classList.remove('show'); }));

// ── Init & Safe Polling (pause while user is editing an input or modal) ──
fetchTasks();
setInterval(() => {
  const activeTag = document.activeElement?.tagName;
  const modalOpen = document.querySelector('.modal-overlay.show');
  if (!modalOpen && !['INPUT','TEXTAREA','SELECT'].includes(activeTag)) {
    fetchTasks();
  }
}, 10000);
</script>
</body>
</html>
